spring.application.name=SecondHandTransaction
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssXXX

# Server
server.port=${PORT:8080}

# --- Database（凭据一律走环境变量，仓库内不留明文）---
# 本地开发：export DB_URL=... DB_USERNAME=... DB_PASSWORD=...
# 部署：把同一组变量配到 PaaS 平台的环境变量或 systemd 的 Environment= 里
# 未提供 DB_PASSWORD 时应用会直接启动失败——这是有意为之，避免静默使用弱默认口令。
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/secondhand}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:secondhand}
spring.datasource.password=${DB_PASSWORD}

# --- 管理后台账号（未配置时后台登录一律拒绝）---
admin.auth.username=${ADMIN_USERNAME:}
admin.auth.password=${ADMIN_PASSWORD:}

# --- 跨域白名单（逗号分隔）；生产同源部署时用不到 ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://124.220.49.156}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 启动时自动更新表结构（不删数据）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=INFO
