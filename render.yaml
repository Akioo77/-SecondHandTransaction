services:
  - type: web
    name: secondhand-backend
    env: docker
    region: oregon
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/SecondHandTransaction-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 以下凭据不在仓库内保存明文：sync: false 表示由平台后台手动填写
      - key: DB_URL
        value: jdbc:postgresql://ep-lingering-unit-amw4168n-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        value: neondb_owner
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
